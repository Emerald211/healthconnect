services:
  postgres:
    image: postgres:16-alpine
    container_name: healthconnect_db
    environment:
      POSTGRES_USER: healthconnect
      POSTGRES_PASSWORD: healthconnect_password
      POSTGRES_DB: healthconnect_db
    ports:
      - "5432:5432"
    volumes:
      - healthconnect_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: healthconnect_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@healthconnect.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  healthconnect_pgdata: